# -------------------------------------------------------------------------------------
# Netlify: builds the app on every push (production from main, a preview link for every
# pull request) and sets the security headers.
# Set in Netlify > Site configuration > Environment variables (both are public values):
#   VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY
# -------------------------------------------------------------------------------------
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: every path loads index.html and the router takes over.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    # Only this site's own scripts, styles and fonts; data only from the G-Squad Supabase
    # project. When the live Supabase project is added, add its URL to connect-src.
    # 'unsafe-inline' for styles covers React style={{}} attributes only; no inline scripts.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://zcysodfxcpjzinjxvayx.supabase.co wss://zcysodfxcpjzinjxvayx.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    # The sign-in link carries a one-time code; never send the full URL to other sites.
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"
    X-Robots-Tag = "noindex, nofollow"

# Built files have content hashes in their names, so they can be cached for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# index.html must always be fresh, so a new release is picked up straight away.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
