# -------------------------------------------------------------------------------------
# Applies new migrations to the Supabase project when they reach main.
# Uses the Supabase CLI (`supabase db push`), which applies only migrations the project
# hasn't had yet and records each one, so it is safe to run repeatedly.
#
# Needs, under Settings > Environments > "supabase-test" (create it; add yourself as a
# required reviewer if you want to approve each run):
#   secrets   SUPABASE_ACCESS_TOKEN  personal access token (supabase.com > Account > Access Tokens)
#             SUPABASE_DB_PASSWORD   the project's database password
#   variables SUPABASE_PROJECT_REF   zcysodfxcpjzinjxvayx
#   Deployment branches and tags: "Selected branches and tags", main only (SECURITY_LOG J02).
#
# The seed (TEC's reference lists) is applied only when run by hand with "include seed"
# ticked: Actions > Deploy database > Run workflow.
# -------------------------------------------------------------------------------------
name: Deploy database

on:
  push:
    branches: [main]
    # Database migrations and Edge Functions (slice 1 added supabase/functions).
    paths: ['supabase/migrations/**', 'supabase/functions/**', 'supabase/templates/**']
  workflow_dispatch:
    inputs:
      include_seed:
        description: Also run supabase/seed.sql (first set-up only)
        type: boolean
        default: false

permissions:
  contents: read

# Never run two deploys at once against the same database.
concurrency:
  group: deploy-database
  cancel-in-progress: false

jobs:
  push:
    # SECURITY REVIEW FIX J02: "Run workflow" lets anyone with write access pick any branch,
    # which would push unreviewed migrations straight to the database. Only main may deploy.
    # (Also restrict the supabase-test environment to the main branch: see SECURITY_LOG.md.)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: supabase-test
    # SECURITY REVIEW FIX J03: the secrets are no longer job-wide. Each one is given only to the
    # Supabase CLI steps that need it, so checkout, setup-node and npm ci never see them.
    env:
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # SECURITY REVIEW FIX J03: the CLI now comes from package-lock.json (exact version and
      # integrity hash, kept current by Dependabot) instead of the third-party action
      # supabase/setup-cli@v1, a movable tag that ran with the database secrets in scope.
      # --ignore-scripts: no dependency install script runs in this job.
      - run: npm ci --ignore-scripts
      - name: Link the project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npx --no-install supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Show what will be applied
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npx --no-install supabase migration list --password "$SUPABASE_DB_PASSWORD"
      - name: Apply migrations
        if: ${{ !inputs.include_seed }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npx --no-install supabase db push --password "$SUPABASE_DB_PASSWORD"
      - name: Apply migrations and seed
        if: ${{ inputs.include_seed }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npx --no-install supabase db push --include-seed --password "$SUPABASE_DB_PASSWORD"
      # Edge Functions (slice 1): deployed after the migrations they rely on. Uses the access
      # token only; the function reads the project's own secret key from its runtime settings.
      # Settings such as verify_jwt come from supabase/config.toml.
      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          npx --no-install supabase functions deploy invite-leader --project-ref "$SUPABASE_PROJECT_REF"
          # Slice 6: The Greatness Brief (settings from supabase/config.toml).
          npx --no-install supabase functions deploy send-newsletter --project-ref "$SUPABASE_PROJECT_REF"
          npx --no-install supabase functions deploy email-link --project-ref "$SUPABASE_PROJECT_REF"
      # Sign-in and invitation emails (supabase/templates). Supabase reads these from the
      # project's auth settings, not from the repository, so they are sent with the Management
      # API. Only these four settings are changed; nothing else in the auth settings is touched.
      # The subjects match supabase/config.toml. jq builds the JSON from the files, so nothing
      # in a template can break out of it.
      - name: Update the sign-in email templates
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          jq -n \
            --rawfile invite supabase/templates/invite.html \
            --rawfile magic supabase/templates/magic_link.html \
            '{mailer_subjects_invite: "Invitation to the G-Squad Planner",
              mailer_templates_invite_content: $invite,
              mailer_subjects_magic_link: "Your G-Squad Planner sign-in",
              mailer_templates_magic_link_content: $magic}' > "$RUNNER_TEMP/auth-templates.json"
          curl --fail-with-body -sS -X PATCH \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @"$RUNNER_TEMP/auth-templates.json" -o "$RUNNER_TEMP/auth-reply.json" \
            || { echo "Updating the templates failed:"; head -c 500 "$RUNNER_TEMP/auth-reply.json"; exit 1; }
          # The reply is the whole auth configuration, so it is not printed when all is well.
          echo "Sign-in email templates updated"
