# -------------------------------------------------------------------------------------
# Loads or removes the made-up sample data on the Supabase project, by hand only.
#
# Why a separate workflow: sample data is not a migration (it must be removable before
# go-live, and real churches never get it), so it never runs on a normal deploy.
#   load    runs supabase/sample-data.sql: 30 invented members, four Sundays, events,
#           one-to-ones and recognitions. Optionally gives the leader roles to one tester's
#           sign-in (invite that person in the app first, so their account exists).
#   remove  runs supabase/sample-data-remove.sql (before go-live, slice 7). It also takes
#           back the roles the load gave.
#
# Same protections as "Deploy database": main branch only, the supabase-test environment,
# and the access token given only to the steps that need it.
#
# SECURITY REVIEW 21 (K02): this workflow can give leader roles (optionally the Resident
# Pastor's) without the Resident Pastor, to anyone who can press "Run workflow" (everyone with
# write access to the repository). So it is switched off unless a repository admin sets the
# repository variable SAMPLE_DATA_ALLOWED to "true" (Settings > Secrets and variables >
# Actions > Variables). Set it only while testing; delete it, and this file, at go-live.
# The SQL itself also refuses to load once sending to members is switched on.
# -------------------------------------------------------------------------------------
name: Sample data

on:
  workflow_dispatch:
    inputs:
      action:
        description: Load or remove the sample data
        type: choice
        options: [load, remove]
        default: load
      tester_email:
        description: (load only) A leader's sign-in email to give roles to. Leave blank for none.
        type: string
        required: false
      role_set:
        description: (load only) Which roles the tester gets
        type: choice
        options: [all, resident_pastor, team_lead]
        default: all
      give_resident_pastor:
        description: (load only) Also give the tester the Resident Pastor role. Only with the Resident Pastor's agreement.
        type: boolean
        default: false

permissions:
  contents: read

# Never alongside a deploy: both change the same database.
concurrency:
  group: deploy-database
  cancel-in-progress: false

jobs:
  run:
    # As SECURITY REVIEW FIX J02: only the reviewed code on main may touch the database.
    # SECURITY REVIEW 21 (K02): and only while an admin has switched sample data on (see top).
    # (A repository variable, not an environment one: those are not readable in a job's "if".)
    if: github.ref == 'refs/heads/main' && vars.SAMPLE_DATA_ALLOWED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: supabase-test
    env:
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts
      - name: Link the project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npx --no-install supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      # The inputs arrive through environment variables, never pasted into the script by
      # GitHub (that would let a crafted value run commands). The script checks each one
      # against a strict pattern before it goes into the SQL (tested in security-guards.test.ts).
      # RUN_BY and RUN_ID are written to the audit log, so each role given or taken back can
      # be traced to the person who pressed "Run workflow" (triggering_actor, not actor: on a
      # re-run, actor is whoever started the first attempt).
      - name: Prepare the SQL
        env:
          ACTION: ${{ inputs.action }}
          TESTER_EMAIL: ${{ inputs.tester_email }}
          GIVE_RESIDENT_PASTOR: ${{ inputs.give_resident_pastor }}
          ROLE_SET: ${{ inputs.role_set }}
          RUN_BY: ${{ github.triggering_actor }}
          RUN_ID: ${{ github.run_id }}
        run: OUT="$RUNNER_TEMP/run.sql" bash scripts/sample-data-prepare.sh
      - name: Run it
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx --no-install supabase db query --linked -f "$RUNNER_TEMP/run.sql"
