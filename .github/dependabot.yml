# Weekly pull requests for outdated or vulnerable dependencies and GitHub Actions.
# Each one runs CI like any other change before it can merge.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # SECURITY REVIEW FIX J07: wait a week before proposing a new release. Most hijacked npm
    # releases are found and pulled within days; this keeps them out of our pull requests.
    # Security updates for known vulnerabilities are not delayed.
    cooldown:
      default-days: 7
    # Major versions that need deliberate work, not an automatic bump:
    #   typescript   7 is the rewritten (Go) compiler; adopt when Vite/oxlint support it.
    #   @types/node  must match the Node version we run (22), not the newest release.
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      # Batch minor and patch updates into one pull request to keep review light.
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
